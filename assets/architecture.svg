<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d19"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <style>
    .headline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .subtext { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 700; }
  </style>

  <rect width="860" height="440" rx="16" fill="url(#bg2)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Diagram Title -->
  <text x="40" y="44" class="headline">Replacing the Database Engine Mid-Flight (Zero Downtime)</text>
  <text x="40" y="64" class="subtext">How Data Time-Machine migrates 50,000,000 rows without locking tables or dropping a single customer payment.</text>

  <!-- Step 1: Live User Highway -->
  <g transform="translate(40, 95)">
    <rect width="220" height="270" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="14" y="14" width="130" height="20" rx="4" fill="#3b82f6" opacity="0.2"/>
    <text x="22" y="28" class="badge" fill="#60a5fa">LIVE USERS HIGHWAY</text>

    <text x="14" y="65" class="mono" fill="#cbd5e1">10,000 writes / sec</text>
    <text x="14" y="85" class="subtext">Orders, logins, payments</text>

    <!-- Visual pipes -->
    <rect x="14" y="110" width="192" height="60" rx="6" fill="#1e293b"/>
    <circle cx="34" cy="140" r="10" fill="#3b82f6"/>
    <text x="54" y="136" class="mono" fill="#f8fafc">Pipe A: Old Database</text>
    <text x="54" y="152" class="mono" fill="#93c5fd">Active read traffic</text>

    <rect x="14" y="185" width="192" height="60" rx="6" fill="#1e293b" stroke="#059669"/>
    <circle cx="34" cy="215" r="10" fill="#10b981"/>
    <text x="54" y="211" class="mono" fill="#f8fafc">Pipe B: Shadow Table</text>
    <text x="54" y="227" class="mono" fill="#34d399">Dual-write stream</text>

    <text x="14" y="260" class="badge" fill="#10b981">ZERO LOCKS ACQUIRED</text>
  </g>

  <!-- Step 2: Background Scanner -->
  <g transform="translate(290, 95)">
    <rect width="260" height="270" rx="12" fill="#0f172a" stroke="#334155"/>
    <rect x="14" y="14" width="140" height="20" rx="4" fill="#f59e0b" opacity="0.2"/>
    <text x="22" y="28" class="badge" fill="#fbbf24">BACKGROUND SCANNER</text>

    <text x="14" y="65" class="mono" fill="#cbd5e1">Copies 500 rows / batch</text>
    <text x="14" y="85" class="subtext">Auto-throttles if replica lags</text>

    <!-- Merkle tree visualization -->
    <rect x="14" y="110" width="232" height="135" rx="8" fill="#1e1814" stroke="#d97706"/>
    <text x="24" y="135" class="badge" fill="#fbbf24">MERKLE TREE BISECTION</text>
    <text x="24" y="155" class="mono" fill="#fde68a">Compares SHA-256 hashes</text>
    <text x="24" y="175" class="mono" fill="#fde68a">Finds row delta in O(log N)</text>

    <line x1="24" y1="190" x2="220" y2="190" stroke="#78350f"/>
    <text x="24" y="212" class="mono" fill="#34d399">[+] 100% Hash Match</text>
    <text x="24" y="230" class="mono" fill="#34d399">[+] 0 Lost Payments</text>
  </g>

  <!-- Step 3: Instant Cutover -->
  <g transform="translate(580, 95)">
    <rect width="240" height="270" rx="12" fill="#061c16" stroke="#059669" stroke-width="2"/>
    <rect x="14" y="14" width="130" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="22" y="28" class="badge" fill="#34d399">1ms ATOMIC SWITCH</text>

    <text x="14" y="68" class="headline" font-size="14" fill="#34d399">Instant Cutover</text>
    <text x="14" y="88" class="subtext">Users never notice a blip.</text>

    <rect x="14" y="115" width="212" height="70" rx="6" fill="#064e3b"/>
    <text x="24" y="140" class="badge" fill="#6ee7b7">TRAFFIC FLIPPED</text>
    <text x="24" y="160" class="mono" fill="#a7f3d0">All reads -&gt; New Schema</text>
    <text x="24" y="175" class="mono" fill="#a7f3d0">Switch time: 0.001 sec</text>

    <rect x="14" y="195" width="212" height="55" rx="6" fill="#0b1714"/>
    <text x="24" y="220" class="mono" fill="#6ee7b7">[+] Zero downtime</text>
    <text x="24" y="238" class="mono" fill="#6ee7b7">[+] Safely retire old schema</text>
  </g>

  <!-- Bottom strip -->
  <rect x="40" y="390" width="780" height="34" rx="6" fill="#030712" stroke="#1f2937"/>
  <circle cx="58" cy="407" r="4" fill="#34d399"/>
  <text x="74" y="411" class="mono" fill="#94a3b8">Guarantee: Upgrades multi-million row databases while customers keep checking out normally.</text>
</svg>
